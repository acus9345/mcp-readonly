name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Unit and integration tests (example servers, shutdown, argv escaping)
        run: npm test
      # Real published servers via npx (on Windows this goes through npx.cmd -> the cmd.exe wrapper).
      # Needs the npm registry; a registry outage fails only this step.
      - name: End-to-end tests against @modelcontextprotocol servers
        run: node test/run.js --test-name-pattern "server-filesystem|server-everything"
        env:
          MCP_READONLY_E2E: '1'
